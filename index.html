<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جمبك مارت — توصيل سريع في الخرطوم</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- ── HEADER ── -->
<header class="hdr">
  <a href="index.html" class="hdr-logo">
    <img src="logo.jpg" alt="جمبك مارت" class="logo-img">
    <span class="logo-mart">مارت</span>
  </a>
  <button class="hdr-loc" onclick="showLocPicker()">
    📍 <span id="loc-label">الخرطوم بحري</span> ▾
  </button>
  <a href="cart.html" class="hdr-cart" title="السلة">
    🛒<span class="cbadge" id="cbadge">0</span>
  </a>
</header>

<main class="page">

  <!-- ── STICKY SEARCH ── -->
  <div class="srch-wrap">
    <div class="search-wrap">
      <span class="si">🔍</span>
      <input type="text" placeholder="ابحث عن منتج أو متجر..." onfocus="location.href='browse.html'" readonly>
    </div>
  </div>

  <!-- ── PROMO BANNERS ── -->
  <div class="banners">
    <div class="banner banner-purple">
      <div class="banner-ico">⚡</div>
      <div>
        <div class="banner-h">توصيل خلال 60 دقيقة</div>
        <div class="banner-s">بقالة · خضار · لحوم · وأكثر</div>
        <a href="stores.html" class="banner-btn">اطلب الآن</a>
      </div>
    </div>
    <div class="banner banner-orange">
      <div class="banner-ico">🔥</div>
      <div>
        <div class="banner-h">عروض اليوم</div>
        <div class="banner-s">خصومات تصل إلى 20%</div>
        <a href="browse.html?filter=offers" class="banner-btn">تصفح</a>
      </div>
    </div>
  </div>

  <!-- ── CATEGORIES ── -->
  <div class="cats" id="cats-row">
    <button class="cat" onclick="location.href='browse.html?cat=bak'">
      <div class="cat-ico bg-bak"><img src="https://images.unsplash.com/photo-1509440159596-0249088772ff?w=80&h=80&fit=crop&auto=format&q=80" alt="مخبوزات" loading="lazy" onerror="this.outerHTML='🍞'"></div>
      <span class="cat-lbl">مخبوزات</span>
    </button>
    <button class="cat" onclick="location.href='browse.html?cat=dairy'">
      <div class="cat-ico bg-dairy"><img src="https://images.unsplash.com/photo-1563636619-e9143da7973b?w=80&h=80&fit=crop&auto=format&q=80" alt="ألبان وبيض" loading="lazy" onerror="this.outerHTML='🥛'"></div>
      <span class="cat-lbl">ألبان وبيض</span>
    </button>
    <button class="cat" onclick="location.href='browse.html?cat=produce'">
      <div class="cat-ico bg-produce"><img src="https://images.unsplash.com/photo-1540420773420-3366772f4999?w=80&h=80&fit=crop&auto=format&q=80" alt="خضار وفاكهة" loading="lazy" onerror="this.outerHTML='🥦'"></div>
      <span class="cat-lbl">خضار وفاكهة</span>
    </button>
    <button class="cat" onclick="location.href='browse.html?cat=meat'">
      <div class="cat-ico bg-meat"><img src="https://images.unsplash.com/photo-1607623814075-e51df1bdc82f?w=80&h=80&fit=crop&auto=format&q=80" alt="لحوم وسمك" loading="lazy" onerror="this.outerHTML='🥩'"></div>
      <span class="cat-lbl">لحوم وسمك</span>
    </button>
    <button class="cat" onclick="location.href='browse.html?cat=grocery'">
      <div class="cat-ico bg-grocery"><img src="https://images.unsplash.com/photo-1586201375761-83865001e31c?w=80&h=80&fit=crop&auto=format&q=80" alt="بقالة" loading="lazy" onerror="this.outerHTML='🛒'"></div>
      <span class="cat-lbl">بقالة</span>
    </button>
    <button class="cat" onclick="location.href='browse.html?cat=drinks'">
      <div class="cat-ico bg-drinks"><img src="https://images.unsplash.com/photo-1600271886742-f049cd451bba?w=80&h=80&fit=crop&auto=format&q=80" alt="مشروبات" loading="lazy" onerror="this.outerHTML='🧃'"></div>
      <span class="cat-lbl">مشروبات</span>
    </button>
    <button class="cat" onclick="location.href='browse.html?cat=snacks'">
      <div class="cat-ico bg-snacks"><img src="https://images.unsplash.com/photo-1548907994-b8e24b7c2987?w=80&h=80&fit=crop&auto=format&q=80" alt="حلويات" loading="lazy" onerror="this.outerHTML='🍫'"></div>
      <span class="cat-lbl">حلويات</span>
    </button>
    <button class="cat" onclick="location.href='browse.html?cat=house'">
      <div class="cat-ico bg-house"><img src="https://images.unsplash.com/photo-1585421514738-01798e348b17?w=80&h=80&fit=crop&auto=format&q=80" alt="منزليات" loading="lazy" onerror="this.outerHTML='🧹'"></div>
      <span class="cat-lbl">منزليات</span>
    </button>
    <button class="cat" onclick="location.href='browse.html?cat=care'">
      <div class="cat-ico bg-care"><img src="https://images.unsplash.com/photo-1556228578-0d85b1a4d571?w=80&h=80&fit=crop&auto=format&q=80" alt="عناية" loading="lazy" onerror="this.outerHTML='🧴'"></div>
      <span class="cat-lbl">عناية</span>
    </button>
    <button class="cat" onclick="location.href='browse.html?cat=frozen'">
      <div class="cat-ico bg-frozen"><img src="https://images.unsplash.com/photo-1497034825429-c343d7c6a68f?w=80&h=80&fit=crop&auto=format&q=80" alt="مجمدات" loading="lazy" onerror="this.outerHTML='❄️'"></div>
      <span class="cat-lbl">مجمدات</span>
    </button>
  </div>

  <div class="dv"></div>

  <!-- ── TODAY'S OFFERS ── -->
  <div class="sec-h">
    <h2>🔥 عروض اليوم</h2>
    <a href="browse.html?filter=offers">الكل</a>
  </div>
  <div class="pscroll" id="offers-scroll"></div>

  <div class="dv"></div>

  <!-- ── NEARBY STORES ── -->
  <div class="sec-h">
    <h2>🏪 المتاجر القريبة</h2>
    <a href="stores.html">الكل</a>
  </div>
  <div id="stores-list"></div>

  <div class="dv"></div>

  <!-- ── MOST POPULAR ── -->
  <div class="sec-h">
    <h2>⭐ الأكثر طلباً</h2>
    <a href="browse.html">عرض الكل</a>
  </div>
  <div class="pgrid" id="popular-grid"></div>

  <div class="dv"></div>

  <!-- ── NEW ARRIVALS ── -->
  <div class="sec-h">
    <h2>🆕 وصل حديثاً</h2>
    <a href="browse.html">عرض الكل</a>
  </div>
  <div class="pscroll" id="new-scroll"></div>

  <div class="sp"></div>
</main>

<!-- ── FLOATING CART BAR ── -->
<a href="cart.html" class="cart-bar" id="cart-bar">
  <span class="cb-ico">🛒</span>
  <span class="cb-label">عرض السلة</span>
  <span class="cb-count" id="cb-count">0</span>
  <span class="cb-total" id="cb-total">0 SDG</span>
</a>

<!-- ── BOTTOM NAV ── -->
<nav class="bnav">
  <a href="index.html" class="bn active" data-page="index.html">
    <span class="ico">🏠</span>الرئيسية
  </a>
  <a href="browse.html" class="bn" data-page="browse.html">
    <span class="ico">🔍</span>تصفح
  </a>
  <a href="orders.html" class="bn" data-page="orders.html">
    <span class="ico">📦</span>طلباتي
    <span class="bn-dot" id="bn-orders"></span>
  </a>
  <a href="account.html" class="bn" data-page="account.html">
    <span class="ico">👤</span>حسابي
  </a>
</nav>

<!-- ── LOCATION PICKER ── -->
<div class="ov-back" id="loc-back" onclick="hideLocPicker()"></div>
<div class="ov-sheet" id="loc-sheet">
  <h3 style="font-size:17px;font-weight:800;margin-bottom:16px;color:var(--tx)">📍 اختر منطقتك</h3>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
    <button class="topt" onclick="setLoc('الخرطوم')"><strong>الخرطوم</strong></button>
    <button class="topt" onclick="setLoc('الخرطوم بحري')"><strong>الخرطوم بحري</strong></button>
    <button class="topt" onclick="setLoc('أم درمان')"><strong>أم درمان</strong></button>
    <button class="topt" onclick="setLoc('الرياض')"><strong>الرياض</strong></button>
    <button class="topt" onclick="setLoc('الكلاكلة')"><strong>الكلاكلة</strong></button>
    <button class="topt" onclick="setLoc('شمبات')"><strong>شمبات</strong></button>
    <button class="topt" onclick="setLoc('الحاج يوسف')"><strong>الحاج يوسف</strong></button>
    <button class="topt" onclick="setLoc('بري')"><strong>بري</strong></button>
  </div>
</div>

<script src="app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    renderStoreList('stores-list', STORES);
    renderScroll('offers-scroll', PRODUCTS.filter(p => p.discount > 0));
    renderGrid('popular-grid', PRODUCTS.filter(p =>
      ['grocery','dairy','bak','drinks'].includes(p.cat)
    ).slice(0, 6));
    renderScroll('new-scroll', PRODUCTS.filter(p =>
      ['meat','frozen','care','produce'].includes(p.cat)
    ).slice(0, 8));
  });

  function showLocPicker() {
    document.getElementById('loc-back').classList.add('on');
    document.getElementById('loc-sheet').classList.add('on');
    document.body.style.overflow = 'hidden';
  }
  function hideLocPicker() {
    document.getElementById('loc-back').classList.remove('on');
    document.getElementById('loc-sheet').classList.remove('on');
    document.body.style.overflow = '';
  }
  function setLoc(name) {
    document.getElementById('loc-label').textContent = name;
    hideLocPicker();
    showToast('📍 تم تغيير الموقع إلى ' + name);
  }
</script>
</body>
</html>
