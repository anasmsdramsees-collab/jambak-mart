<script src="app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    renderStoreList('stores-list', STORES);
    renderScroll('offers-scroll', PRODUCTS.filter(p => p.discount > 0));
    renderGrid('popular-grid', PRODUCTS.filter(p =>
      ['grocery','dairy','bak','drinks'].includes(p.cat)
    ).slice(0, 6));
    renderScroll('new-scroll', PRODUCTS.filter(p =>
      ['meat','frozen','care','produce'].includes(p.cat)
    ).slice(0, 8));

    // Banner slideshow
    const total = 8, slides = document.getElementById('jm-slides');
    const dots = document.querySelectorAll('.jm-dot');
    let cur = 0;
    function goTo(n) {
      cur = (n + total) % total;
      slides.style.transform = `translateX(${cur * 100}%)`;
      dots.forEach((d,i) => d.classList.toggle('active', i === cur));
    }
    dots.forEach((d,i) => d.addEventListener('click', () => goTo(i)));
    const timer = setInterval(() => goTo(cur + 1), 3500);
    let sx = 0;
    slides.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
    slides.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - sx;
      if (Math.abs(dx) > 40) { clearInterval(timer); goTo(dx > 0 ? cur - 1 : cur + 1); }
    }, {passive:true});
  });

  function showLocPicker() {
    document.getElementById('loc-back').classList.add('on');
    document.getElementById('loc-sheet').classList.add('on');
    document.body.style.overflow = 'hidden';
  }
  function hideLocPicker() {
    document.getElementById('loc-back').classList.remove('on');
    document.getElementById('loc-sheet').classList.remove('on');
    document.body.style.overflow = '';
  }
  function setLoc(name) {
    document.getElementById('loc-label').textContent = name;
    hideLocPicker();
    showToast('📍 تم تغيير الموقع إلى ' + name);
  }
</script>
