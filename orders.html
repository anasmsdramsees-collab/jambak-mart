<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طلباتي | جمبك مارت</title>
<link rel="stylesheet" href="app.css?v=5">
</head>
<body>

<!-- ── APP SWITCHER ── -->
<div class="app-sw-wrap">
  <div class="app-sw">
    <button class="app-tab app-tab-featured" onclick="location.href='index.html'">
      <img src="icons/icon-mart.png?v=3" alt="مارت" class="app-tab-logo">
      <span>حاجات البيت</span>
    </button>
    <button class="app-tab app-tab-featured" onclick="location.href='taga.html'">
      <img src="icons/icon-foodz.png?v=3" alt="فود" class="app-tab-logo">
      <span>مطاعم</span>
    </button>
    <button class="app-tab" onclick="location.href='hypermall.html'">
      <img src="icons/icon-hypermall.png?v=3" alt="هايبر مول" class="app-tab-logo">
      <span>هايبر مول</span>
    </button>
    <button class="app-tab" onclick="location.href='services.html'">
      <img src="icons/icon-services.png?v=3" alt="سيرفيس" class="app-tab-logo">
      <span>سيرفيس</span>
    </button>
    <button class="app-tab" onclick="location.href='jambak.html'">
      <img src="icons/icon-jambak.png?v=3" alt="ماركت" class="app-tab-logo">
      <span>ماركت</span>
    </button>
  </div>
</div>
<script>!function(){function u(){var e=document.querySelector(".app-sw-wrap");if(e){var h=e.getBoundingClientRect().height||e.offsetHeight;if(h>0)document.documentElement.style.setProperty("--swh",h+"px")}}window.addEventListener("load",u);window.addEventListener("resize",u);requestAnimationFrame(function(){u();setTimeout(u,80);setTimeout(u,300)});}();</script>


<header class="hdr">
  <a href="index.html" class="hdr-back">←</a>
  <div class="hdr-title">الطلبات</div>
  <div style="width:40px"></div>
</header>

<main class="page" style="background:#F5F5F5;padding-top:0">

  <!-- Search + Filter -->
  <div class="ord-search-bar">
    <div class="ord-search-inner">
      <span style="color:#aaa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
      <input type="text" placeholder="ابحث في طلباتك..." style="border:none;outline:none;font-family:inherit;font-size:13px;flex:1;background:transparent;color:#333">
    </div>
    <button class="ord-filter-btn" onclick="showToast('فلتر: قريباً!')">آخر 3 أشهر ▾</button>
  </div>

  <!-- Active order -->
  <div id="active-order-wrap"></div>

  <!-- Completed orders -->
  <div class="ord-section-title">مكتملة</div>
  <div id="orders-list"></div>

  <div class="sp"></div>
</main>

<nav class="bnav">
  <a href="index.html" class="bn"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>الرئيسية</a>
  <a href="browse.html" class="bn"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>تصفح</a>
  <a href="browse.html?filter=offers" class="bn-center">
    <span class="bn-center-pill">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      عروض
    </span>
  </a>
  <a href="orders.html" class="bn active"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg></span>طلباتي</a>
  <a href="account.html" class="bn"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>حسابي</a>
</nav>

<script src="app.js"></script>
<script>
  const ORDERS = [
    {
      id: 'JM-7823',
      store: 'جمبك مارت',
      date: 'اليوم · 11:02 ص',
      status: 'progress',
      img: '🛵',
      items: [
        { name: 'عيش أبيض 700 جرام', img: '🍞' },
        { name: 'حليب نيدو 400 جرام', img: '🥛' },
      ],
      total: 4250,
    },
    {
      id: 'JM-7765',
      store: 'جمبك مارت',
      date: 'أمس · 3:30 م',
      status: 'delivered',
      img: '📦',
      items: [
        { name: 'أرز بسمتي 2 كيلو', img: '🍚' },
        { name: 'زيت دوار الشمس 1.5 لتر', img: '🫙' },
        { name: 'بصل أبيض 1 كيلو', img: '🧅' },
      ],
      total: 5180,
    },
    {
      id: 'JM-7701',
      store: 'هايبر مول',
      date: '2 يناير 2025',
      status: 'delivered',
      img: '📦',
      items: [
        { name: 'دجاج طازج 1 كيلو', img: '🍗' },
        { name: 'خضار مشكلة 500 جرام', img: '🥦' },
        { name: 'بيض بلدي 30 بيضة', img: '🥚' },
      ],
      total: 6800,
    },
    {
      id: 'JM-7689',
      store: 'جمبك مارت',
      date: '31 ديسمبر 2024',
      status: 'delivered',
      img: '📦',
      items: [
        { name: 'نسكافيه كلاسيك 200 جرام', img: '☕' },
        { name: 'شاي أحمر 100 كيس', img: '🍵' },
        { name: 'مياه معدنية 6 زجاجات', img: '💧' },
      ],
      total: 4200,
    },
    {
      id: 'JM-7612',
      store: 'جمبك مارت',
      date: '28 ديسمبر 2024',
      status: 'cancelled',
      img: '❌',
      items: [
        { name: 'سمبوسة مجمدة 20 قطعة', img: '🥟' },
        { name: 'آيس كريم فانيلا 1 لتر', img: '🍦' },
      ],
      total: 4300,
    },
  ];

  function renderOrders() {
    // Active order callout
    const active = ORDERS.find(o => o.status === 'progress');
    const activeWrap = document.getElementById('active-order-wrap');
    if (active) {
      activeWrap.innerHTML = `
        <a href="tracking.html" style="text-decoration:none;display:block;margin:12px 16px;
          background:linear-gradient(135deg,var(--p2),var(--p1));border-radius:16px;padding:14px;color:#fff">
          <div style="font-size:10px;opacity:.75;margin-bottom:6px;font-weight:600">طلب قيد التوصيل</div>
          <div style="display:flex;align-items:center;gap:12px">
            <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="34" height="34"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg></div>
            <div style="flex:1">
              <div style="font-size:15px;font-weight:800">${active.id} · في الطريق</div>
              <div style="font-size:12px;opacity:.8;margin-top:2px">الوصول خلال 28 دقيقة تقريباً</div>
            </div>
            <div style="font-size:22px">‹</div>
          </div>
        </a>`;
    }

    // Completed + cancelled orders
    const done = ORDERS.filter(o => o.status !== 'progress');
    const list = document.getElementById('orders-list');
    list.innerHTML = done.map(o => `
      <div class="ord-card" onclick="location.href='${o.status === 'progress' ? 'tracking' : 'orders'}.html'">
        <div class="ord-card-head">
          <div>
            <span class="ord-id">${o.id}</span>
            <span class="ord-store-badge">${o.store}</span>
          </div>
          <span class="ord-status ${o.status === 'delivered' ? 'os-done' : 'os-cancel'}">
            ${o.status === 'delivered' ? '✅ تم التوصيل' : '❌ ملغي'}
          </span>
        </div>
        <div class="ord-date">${o.date}</div>
        ${o.items.map(item => `
          <div class="ord-item-row">
            <span class="ord-item-ico">${item.img}</span>
            <span class="ord-item-name">${item.name}</span>
          </div>`).join('')}
        <div class="ord-card-foot">
          <span class="ord-total">${o.total.toLocaleString()} SDG</span>
          <a href="index.html" class="ord-reorder-btn" onclick="event.stopPropagation();showToast('✅ تمت الإضافة للسلة')">
            🔄 إعادة الطلب
          </a>
        </div>
        ${o.status === 'delivered' ? `
        <div class="ord-review-row">
          <span class="ord-review-label">شارك تجربتك</span>
          <div class="ord-review-btns">
            <button onclick="event.stopPropagation();showToast('شكراً على تقييم المتجر!')">المتجر</button>
            <button onclick="event.stopPropagation();showToast('شكراً على تقييم المنتج!')">المنتج</button>
            <button onclick="event.stopPropagation();showToast('شكراً على تقييم التوصيل!')">التوصيل</button>
          </div>
        </div>` : ''}
      </div>`).join('');
  }

  document.addEventListener('DOMContentLoaded', renderOrders);
</script>
</body>
</html>
