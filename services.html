<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جمبك خدمات — خدمات منزلية</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- ── APP SWITCHER ── -->
<div class="app-sw-wrap">
  <div class="app-sw">
    <button class="app-tab" onclick="location.href='jambak.html'">
      <img src="icons/icon-jambak.png" alt="جمبك" class="app-tab-logo">
      <span>جمبك</span>
    </button>
    <button class="app-tab" onclick="location.href='hypermall.html'">
      <img src="icons/icon-hypermall.png" alt="هايبر مول" class="app-tab-logo">
      <span>هايبر مول</span>
    </button>
    <button class="app-tab" onclick="location.href='taga.html'">
      <img src="icons/icon-foodz.png" alt="فودز" class="app-tab-logo">
      <span>فودز</span>
    </button>
    <button class="app-tab active">
      <img src="icons/icon-services.png" alt="الخدمات" class="app-tab-logo">
      <span>الخدمات</span>
    </button>
    <button class="app-tab" onclick="location.href='index.html'">
      <img src="icons/icon-mart.png" alt="جمبك مارت" class="app-tab-logo">
      <span>جمبك مارت</span>
    </button>
  </div>
</div>

<header class="hdr hdr-home" style="top:57px;background:linear-gradient(135deg,#7B1FA2,#4A148C)!important;border-bottom:none;">
  <div style="flex:1;font-size:16px;font-weight:900;color:#fff;text-align:center;">جمبك سيرفيس</div>
  <a href="cart.html" class="hdr-cart" style="background:rgba(255,255,255,.2);">🛒<span class="cbadge" id="cbadge">0</span></a>
</header>

<main class="page" style="background:#F5F5F5;padding-top:0">

  <!-- Delivery strip -->
  <div class="delivery-strip" style="background:#F3E5F5;color:#4A148C;border-color:#E1BEE7">
    🛠️ <strong>الخدمات بين إيديك</strong> · عناية شخصية، نظافة، صيانة
  </div>

  <!-- Search -->
  <div class="srch-wrap" style="top:calc(var(--hh) + 57px)">
    <div class="search-wrap">
      <span class="si">🔍</span>
      <input type="text" placeholder="ابحث عن خدمة..." readonly onclick="showToast('البحث — قريباً!')">
    </div>
  </div>

  <!-- ── APP HERO BANNER ── -->
  <div class="app-hero">
    <div class="app-hero-bg" style="background-image:url('banners/banner-services.jpg')"></div>
    <div class="app-hero-ov"></div>
    <div class="app-hero-cnt">
      <img class="app-hero-ico" src="icons/icon-services.png" alt="جمبك سيرفيس">
      <div class="app-hero-name">جمبك سيرفيس</div>
      <div class="app-hero-sub">تنظيف · صيانة · عناية شخصية</div>
    </div>
  </div>

  <!-- Category tabs -->
  <div class="cat-tabs" style="background:#fff;border-bottom:1px solid #EEE">
    <button class="cat-tab cat-tab-active">
      <span class="ct-ico" style="background:#F3E5F5">🧹</span><span>الكل</span>
    </button>
    <button class="cat-tab">
      <span class="ct-ico" style="background:#FCE4EC">💆</span><span>عناية</span>
    </button>
    <button class="cat-tab">
      <span class="ct-ico" style="background:#E3F2FD">🔧</span><span>صيانة</span>
    </button>
    <button class="cat-tab">
      <span class="ct-ico" style="background:#F3E5F5">🧺</span><span>غسيل</span>
    </button>
    <button class="cat-tab">
      <span class="ct-ico" style="background:#FFF8E1">🌿</span><span>حدائق</span>
    </button>
  </div>

  <!-- Services Grid -->
  <div id="svc-grid" style="padding:12px 16px">
    <div class="svc-section-title">💆 عناية شخصية</div>
    <div class="svc-grid">
      <button class="svc-card" onclick="bookService('مساج للسيدات')">
        <div class="svc-ico"><img src="https://images.unsplash.com/photo-1544161513-0179fe746fd5?w=120&h=120&fit=crop&auto=format&q=80" alt="مساج للسيدات" onerror="this.parentNode.innerHTML='💆'"></div>
        <div class="svc-name">مساج للسيدات</div>
        <div class="svc-price">من 3,500 SDG</div>
      </button>
      <button class="svc-card" onclick="bookService('مانيكير وباديكير')">
        <div class="svc-ico"><img src="https://images.unsplash.com/photo-1604654894610-df63bc536371?w=120&h=120&fit=crop&auto=format&q=80" alt="مانيكير وباديكير" onerror="this.parentNode.innerHTML='💅'"></div>
        <div class="svc-name">مانيكير وباديكير</div>
        <div class="svc-price">من 1,500 SDG</div>
      </button>
      <button class="svc-card" onclick="bookService('عناية بالبشرة')">
        <div class="svc-ico"><img src="https://images.unsplash.com/photo-1515377905703-c4788e51af15?w=120&h=120&fit=crop&auto=format&q=80" alt="عناية بالبشرة" onerror="this.parentNode.innerHTML='✨'"></div>
        <div class="svc-name">عناية بالبشرة</div>
        <div class="svc-price">من 2,000 SDG</div>
      </button>
    </div>

    <div class="svc-section-title">🧹 تنظيف المنزل</div>
    <div class="svc-grid">
      <button class="svc-card" onclick="bookService('تنظيف زيارة واحدة')">
        <div class="svc-ico"><img src="https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=120&h=120&fit=crop&auto=format&q=80" alt="تنظيف زيارة واحدة" onerror="this.parentNode.innerHTML='🧹'"></div>
        <div class="svc-name">تنظيف زيارة واحدة</div>
        <div class="svc-price">من 2,500 SDG</div>
      </button>
      <button class="svc-card" onclick="bookService('تنظيف شهري')">
        <div class="svc-ico"><img src="https://images.unsplash.com/photo-1585421514738-01798e348b17?w=120&h=120&fit=crop&auto=format&q=80" alt="باقة شهرية" onerror="this.parentNode.innerHTML='📅'"></div>
        <div class="svc-name">باقة شهرية</div>
        <div class="svc-price">من 8,000 SDG</div>
      </button>
      <button class="svc-card" onclick="bookService('كوي الملابس')">
        <div class="svc-ico"><img src="https://images.unsplash.com/photo-1523381294911-8d3cead13475?w=120&h=120&fit=crop&auto=format&q=80" alt="كوي الملابس" onerror="this.parentNode.innerHTML='👔'"></div>
        <div class="svc-name">كوي الملابس</div>
        <div class="svc-price">من 800 SDG</div>
      </button>
      <button class="svc-card" onclick="bookService('تنظيف شامل')">
        <div class="svc-ico"><img src="https://images.unsplash.com/photo-1563916820-0600f0b2e2b6?w=120&h=120&fit=crop&auto=format&q=80" alt="تنظيف شامل" onerror="this.parentNode.innerHTML='🏠'"></div>
        <div class="svc-name">تنظيف شامل</div>
        <div class="svc-price">من 5,000 SDG</div>
      </button>
      <button class="svc-card" onclick="bookService('غسيل ملابس')">
        <div class="svc-ico"><img src="https://images.unsplash.com/photo-1545173168-9f1c17c31a1e?w=120&h=120&fit=crop&auto=format&q=80" alt="غسيل ملابس" onerror="this.parentNode.innerHTML='🧺'"></div>
        <div class="svc-name">غسيل ملابس</div>
        <div class="svc-price">من 1,200 SDG</div>
      </button>
      <button class="svc-card" onclick="bookService('تنظيف سجاد')">
        <div class="svc-ico"><img src="https://images.unsplash.com/photo-1584438784-7e5c2f08e8ab?w=120&h=120&fit=crop&auto=format&q=80" alt="تنظيف سجاد" onerror="this.parentNode.innerHTML='🪞'"></div>
        <div class="svc-name">تنظيف سجاد</div>
        <div class="svc-price">من 1,800 SDG</div>
      </button>
    </div>

    <div class="svc-section-title">🔧 صيانة ومعالجة</div>
    <div class="svc-grid">
      <button class="svc-card" onclick="bookService('صيانة منزل')">
        <div class="svc-ico"><img src="https://images.unsplash.com/photo-1581578731548-c64695cc6952?w=120&h=120&fit=crop&auto=format&q=80" alt="صيانة منزل" onerror="this.parentNode.innerHTML='🔧'"></div>
        <div class="svc-name">صيانة منزل</div>
        <div class="svc-price">من 1,500 SDG</div>
      </button>
      <button class="svc-card" onclick="bookService('إصلاح كهرباء')">
        <div class="svc-ico"><img src="https://images.unsplash.com/photo-1621905251189-8f70ae4a6441?w=120&h=120&fit=crop&auto=format&q=80" alt="إصلاح كهرباء" onerror="this.parentNode.innerHTML='⚡'"></div>
        <div class="svc-name">إصلاح كهرباء</div>
        <div class="svc-price">من 1,000 SDG</div>
      </button>
      <button class="svc-card" onclick="bookService('سباكة')">
        <div class="svc-ico"><img src="https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=120&h=120&fit=crop&auto=format&q=80" alt="سباكة" onerror="this.parentNode.innerHTML='🚿'"></div>
        <div class="svc-name">سباكة</div>
        <div class="svc-price">من 1,200 SDG</div>
      </button>
      <button class="svc-card" onclick="bookService('صيانة مكيفات')">
        <div class="svc-ico"><img src="https://images.unsplash.com/photo-1585771724684-38269d6639fd?w=120&h=120&fit=crop&auto=format&q=80" alt="صيانة مكيفات" onerror="this.parentNode.innerHTML='❄️'"></div>
        <div class="svc-name">صيانة مكيفات</div>
        <div class="svc-price">من 2,000 SDG</div>
      </button>
      <button class="svc-card" onclick="bookService('مكافحة حشرات')">
        <div class="svc-ico"><img src="https://images.unsplash.com/photo-1526470498-825d4a1bcd5f?w=120&h=120&fit=crop&auto=format&q=80" alt="مكافحة حشرات" onerror="this.parentNode.innerHTML='🐛'"></div>
        <div class="svc-name">مكافحة حشرات</div>
        <div class="svc-price">من 3,000 SDG</div>
      </button>
      <button class="svc-card" onclick="bookService('دهانات')">
        <div class="svc-ico"><img src="https://images.unsplash.com/photo-1562259929-b44a3dc545a8?w=120&h=120&fit=crop&auto=format&q=80" alt="دهانات" onerror="this.parentNode.innerHTML='🖌️'"></div>
        <div class="svc-name">دهانات</div>
        <div class="svc-price">من 4,000 SDG</div>
      </button>
    </div>
  </div>

  <div class="sp"></div>
</main>

<nav class="bnav">
  <a href="index.html" class="bn"><span class="ico">🏠</span>الرئيسية</a>
  <a href="browse.html" class="bn"><span class="ico">🔍</span>تصفح</a>
  <a href="orders.html" class="bn"><span class="ico">📦</span>طلباتي</a>
  <a href="account.html" class="bn"><span class="ico">👤</span>حسابي</a>
</nav>

<script src="app.js"></script>
<script>
  function bookService(name) {
    showToast('✅ تم تسجيل طلبك لـ ' + name + ' — سنتصل بك قريباً');
  }
</script>
</body>
</html>
