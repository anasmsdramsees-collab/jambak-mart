<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جمبك خدمات, خدمات منزلية</title>
<link rel="stylesheet" href="app.css?v=5">
<style>:root{--swh:0px}</style>
</head>
<body>

<div class="jm-hdr">
  <div class="jm-hdr-top">
    <div class="jm-loc">
      <span class="jm-loc-lbl">التوصيل إلى</span>
      <span class="jm-loc-val">📍 <span id="loc-label">الخرطوم بحري</span> ▾</span>
    </div>
    <div style="display:flex;gap:8px">
      <a href="home.html" class="jm-icon-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </a>
      <a href="cart.html" class="jm-icon-btn" style="position:relative">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 001.99 1.61h9.72a2 2 0 001.99-1.61L23 6H6"/></svg>
        <span class="cbadge" id="cbadge">0</span>
      </a>
    </div>
  </div>
  <div class="jm-search">
    <span class="jm-search-ico">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </span>
    <input type="text" placeholder="ابحث..." onfocus="location.href='browse.html'" readonly>
  </div>
</div>

<main class="page" style="background:#FAFAFA;padding-top:115px">

  <div class="jm-promo">
    <div>
      <div class="jm-promo-title">عروض ما بتنتهي 🔥</div>
      <div class="jm-promo-sub">خدمات منزلية موثوقة</div>
      <a href="browse.html?filter=offers" class="jm-promo-btn">اطلب هسه</a>
    </div>
    <div style="font-size:52px;opacity:0.9">🔧</div>
  </div>

  <!-- Search -->
  <div class="srch-wrap" style="top:calc(var(--swh) + var(--hh))">
    <div class="search-wrap">
      <span class="si"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
      <input type="text" placeholder="ابحث عن خدمة..." readonly onclick="showToast('البحث, قريباً!')">
    </div>
  </div>

  <!-- Hero banner -->
  <div style="position:relative;margin:0 0 4px;">
    <img src="banners/banner-services.jpg" alt="خدمات" style="width:100%;aspect-ratio:16/9;object-fit:cover;display:block;">
    <div style="position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to top,rgba(204,85,0,.88),transparent);padding:20px 16px 16px;color:#fff;">
      <div style="font-size:18px;font-weight:900;">خدمات منزلية موثوقة</div>
      <div style="font-size:12px;opacity:.85;margin-top:4px;">تنظيف · صيانة · عناية شخصية</div>
      <a href="#svc-grid" style="display:inline-block;margin-top:12px;background:rgba(255,255,255,.2);color:#fff;border:1.5px solid rgba(255,255,255,.4);border-radius:999px;padding:8px 22px;font-family:inherit;font-size:13px;font-weight:800;text-decoration:none;">احجز الآن ↓</a>
    </div>
  </div>

  <!-- Category tabs -->
  <div class="cat-tabs" style="background:#fff;border-bottom:1px solid #EEE">
    <button class="cat-tab cat-tab-active">
      <span class="ct-ico" style="background:#FFF1E6"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg></span><span>الكل</span>
    </button>
    <button class="cat-tab">
      <span class="ct-ico" style="background:#FFF1E6"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg></span><span>عناية</span>
    </button>
    <button class="cat-tab">
      <span class="ct-ico" style="background:#FFF1E6"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg></span><span>صيانة</span>
    </button>
    <button class="cat-tab">
      <span class="ct-ico" style="background:#FFF1E6"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M12 2.69l5.66 5.66a8 8 0 11-11.31 0z"/></svg></span><span>غسيل</span>
    </button>
    <button class="cat-tab">
      <span class="ct-ico" style="background:#FFF1E6"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M17 8C8 10 5.9 16.17 3.82 19.34a1 1 0 001.66 1.14L6 20"/><path d="M17 8L11 14"/><path d="M17 8V3a1 1 0 00-1-1H5a1 1 0 00-1 1v7a1 1 0 001 1h4"/></svg></span><span>حدائق</span>
    </button>
  </div>

  <!-- Services Grid -->
  <div id="svc-grid" style="padding:12px 16px">
    <div class="svc-section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg> عناية شخصية</div>
    <div class="svc-grid">
      <button class="svc-card" onclick="bookService('مساج للسيدات')">
        <div class="svc-ico"><img src="https://images.unsplash.com/photo-1544161513-0179fe746fd5?w=120&h=120&fit=crop&auto=format&q=80" alt="مساج للسيدات" onerror="this.style.display='none'"></div>
        <div class="svc-name">مساج للسيدات</div>
        <div class="svc-price">من 3,500 SDG</div>
      </button>
      <button class="svc-card" onclick="bookService('مانيكير وباديكير')">
        <div class="svc-ico"><img src="https://images.unsplash.com/photo-1604654894610-df63bc536371?w=120&h=120&fit=crop&auto=format&q=80" alt="مانيكير وباديكير" onerror="this.style.display='none'"></div>
        <div class="svc-name">مانيكير وباديكير</div>
        <div class="svc-price">من 1,500 SDG</div>
      </button>
      <button class="svc-card" onclick="bookService('عناية بالبشرة')">
        <div class="svc-ico"><img src="https://images.unsplash.com/photo-1515377905703-c4788e51af15?w=120&h=120&fit=crop&auto=format&q=80" alt="عناية بالبشرة" onerror="this.style.display='none'"></div>
        <div class="svc-name">عناية بالبشرة</div>
        <div class="svc-price">من 2,000 SDG</div>
      </button>
    </div>

    <div class="svc-section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg> تنظيف المنزل</div>
    <div class="svc-grid">
      <button class="svc-card" onclick="bookService('تنظيف زيارة واحدة')">
        <div class="svc-ico"><img src="https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=120&h=120&fit=crop&auto=format&q=80" alt="تنظيف زيارة واحدة" onerror="this.style.display='none'"></div>
        <div class="svc-name">تنظيف زيارة واحدة</div>
        <div class="svc-price">من 2,500 SDG</div>
      </button>
      <button class="svc-card" onclick="bookService('تنظيف شهري')">
        <div class="svc-ico"><img src="https://images.unsplash.com/photo-1585421514738-01798e348b17?w=120&h=120&fit=crop&auto=format&q=80" alt="باقة شهرية" onerror="this.style.display='none'"></div>
        <div class="svc-name">باقة شهرية</div>
        <div class="svc-price">من 8,000 SDG</div>
      </button>
      <button class="svc-card" onclick="bookService('كوي الملابس')">
        <div class="svc-ico"><img src="https://images.unsplash.com/photo-1523381294911-8d3cead13475?w=120&h=120&fit=crop&auto=format&q=80" alt="كوي الملابس" onerror="this.style.display='none'"></div>
        <div class="svc-name">كوي الملابس</div>
        <div class="svc-price">من 800 SDG</div>
      </button>
      <button class="svc-card" onclick="bookService('تنظيف شامل')">
        <div class="svc-ico"><img src="https://images.unsplash.com/photo-1563916820-0600f0b2e2b6?w=120&h=120&fit=crop&auto=format&q=80" alt="تنظيف شامل" onerror="this.style.display='none'"></div>
        <div class="svc-name">تنظيف شامل</div>
        <div class="svc-price">من 5,000 SDG</div>
      </button>
      <button class="svc-card" onclick="bookService('غسيل ملابس')">
        <div class="svc-ico"><img src="https://images.unsplash.com/photo-1545173168-9f1c17c31a1e?w=120&h=120&fit=crop&auto=format&q=80" alt="غسيل ملابس" onerror="this.style.display='none'"></div>
        <div class="svc-name">غسيل ملابس</div>
        <div class="svc-price">من 1,200 SDG</div>
      </button>
      <button class="svc-card" onclick="bookService('تنظيف سجاد')">
        <div class="svc-ico"><img src="https://images.unsplash.com/photo-1584438784-7e5c2f08e8ab?w=120&h=120&fit=crop&auto=format&q=80" alt="تنظيف سجاد" onerror="this.style.display='none'"></div>
        <div class="svc-name">تنظيف سجاد</div>
        <div class="svc-price">من 1,800 SDG</div>
      </button>
    </div>

    <div class="svc-section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg> صيانة ومعالجة</div>
    <div class="svc-grid">
      <button class="svc-card" onclick="bookService('صيانة منزل')">
        <div class="svc-ico"><img src="https://images.unsplash.com/photo-1581578731548-c64695cc6952?w=120&h=120&fit=crop&auto=format&q=80" alt="صيانة منزل" onerror="this.style.display='none'"></div>
        <div class="svc-name">صيانة منزل</div>
        <div class="svc-price">من 1,500 SDG</div>
      </button>
      <button class="svc-card" onclick="bookService('إصلاح كهرباء')">
        <div class="svc-ico"><img src="https://images.unsplash.com/photo-1621905251189-8f70ae4a6441?w=120&h=120&fit=crop&auto=format&q=80" alt="إصلاح كهرباء" onerror="this.style.display='none'"></div>
        <div class="svc-name">إصلاح كهرباء</div>
        <div class="svc-price">من 1,000 SDG</div>
      </button>
      <button class="svc-card" onclick="bookService('سباكة')">
        <div class="svc-ico"><img src="https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=120&h=120&fit=crop&auto=format&q=80" alt="سباكة" onerror="this.style.display='none'"></div>
        <div class="svc-name">سباكة</div>
        <div class="svc-price">من 1,200 SDG</div>
      </button>
      <button class="svc-card" onclick="bookService('صيانة مكيفات')">
        <div class="svc-ico"><img src="https://images.unsplash.com/photo-1585771724684-38269d6639fd?w=120&h=120&fit=crop&auto=format&q=80" alt="صيانة مكيفات" onerror="this.style.display='none'"></div>
        <div class="svc-name">صيانة مكيفات</div>
        <div class="svc-price">من 2,000 SDG</div>
      </button>
      <button class="svc-card" onclick="bookService('مكافحة حشرات')">
        <div class="svc-ico"><img src="https://images.unsplash.com/photo-1526470498-825d4a1bcd5f?w=120&h=120&fit=crop&auto=format&q=80" alt="مكافحة حشرات" onerror="this.style.display='none'"></div>
        <div class="svc-name">مكافحة حشرات</div>
        <div class="svc-price">من 3,000 SDG</div>
      </button>
      <button class="svc-card" onclick="bookService('دهانات')">
        <div class="svc-ico"><img src="https://images.unsplash.com/photo-1562259929-b44a3dc545a8?w=120&h=120&fit=crop&auto=format&q=80" alt="دهانات" onerror="this.style.display='none'"></div>
        <div class="svc-name">دهانات</div>
        <div class="svc-price">من 4,000 SDG</div>
      </button>
    </div>
  </div>

  <div class="sp"></div>
</main>

<nav class="bnav">
  <a href="index.html" class="bn"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>الرئيسية</a>
  <a href="browse.html" class="bn"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>تصفح</a>
  <a href="browse.html?filter=offers" class="bn-center">
    <span class="bn-center-pill">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      عروض
    </span>
  </a>
  <a href="orders.html" class="bn"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg></span>طلباتي</a>
  <a href="account.html" class="bn"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>حسابي</a>
</nav>

<script src="app.js"></script>
<script>
  function bookService(name) {
    showToast('✅ تم تسجيل طلبك لـ ' + name + ', سنتصل بك قريباً');
  }
</script>
</body>
</html>
