</head>

<main class="page" style="padding-top:0">

  <!-- ── TOP SECTION (purple) ── -->
  <div class="trk-top" style="padding-top:80px">

    <div class="trk-title" id="status-text">المندوب في الطريق</div>
    <div class="trk-sub">الوصول خلال <span id="eta-display">28</span> دقيقة تقريباً</div>
    <div class="trk-num"># JM-7823</div>

  <!-- ── BOTTOM SHEET (white) ── -->

    <!-- Horizontal Timeline -->

         style="--prog:50%">
      <div class="ht-step done" id="step-order">
        <div class="ht-dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div>
        <div class="ht-lbl">استلام<br>الطلب</div>
      </div>
      <div class="ht-step done" id="step-prep">
        <div class="ht-dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div>
        <div class="ht-lbl">جاري<br>التجهيز</div>
      </div>
      <div class="ht-step active" id="step-delivery">
        <div class="ht-dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg></div>
        <div class="ht-lbl">في<br>الطريق</div>
      </div>
      <div class="ht-step" id="step-done">
        <div class="ht-dot" style="color:var(--muted)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>
        <div class="ht-lbl">تم<br>التوصيل</div>
      </div>
    </div>

    <!-- Map mock -->
    <div class="map-box">
      <div class="map-scooter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg></div>
      <div class="map-home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>
      <div class="map-store"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg></div>
      <div class="map-line"></div>
      <div class="map-lbl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg> الخرطوم بحري</div>
    </div>

    <!-- ETA box -->
    <div class="eta-box">
      <div class="clock">⏱️</div>
      <div style="flex:1">
        <div class="eta-lbl">الوقت المتبقي للتوصيل</div>
        <div class="eta-val" id="countdown">28:45</div>
      </div>
      <div style="font-size:12px;color:var(--muted);text-align:center">دقيقة<br>ثانية</div>
    </div>

    <!-- Driver card -->
    <div class="driver-card">
      <div class="driver-av"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="32" height="32"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
      <div style="flex:1">
        <div class="driver-name">أحمد محمد</div>
        <div class="driver-meta">دراجة نارية · رقم: XK-452</div>
        <div style="font-size:12px;color:var(--yel);margin-top:2px"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none" width="14" height="14"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg><svg viewBox="0 0 24 24" fill="currentColor" stroke="none" width="14" height="14"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg><svg viewBox="0 0 24 24" fill="currentColor" stroke="none" width="14" height="14"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg><svg viewBox="0 0 24 24" fill="currentColor" stroke="none" width="14" height="14"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg><svg viewBox="0 0 24 24" fill="currentColor" stroke="none" width="14" height="14"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></div>
      </div>
      <button class="driver-call" onclick="showToast('جاري الاتصال...')" title="اتصل بالمندوب"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.9 10.8 19.79 19.79 0 01.87 2.18 2 2 0 012.85 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L7.09 7.91a16 16 0 006 6l.91-.91a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg></button>
    </div>

    <!-- Order items -->
    <div>
      <div style="font-size:15px;font-weight:800;color:var(--tx);margin-bottom:10px">منتجات طلبك</div>
      <div id="order-items-list" style="display:flex;flex-direction:column;gap:8px"></div>
    </div>

    <!-- Support -->
    <div style="margin-top:16px">
      <button onclick="showToast('جاري الاتصال بخدمة العملاء...')" class="big-btn outline">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.9 10.8 19.79 19.79 0 01.87 2.18 2 2 0 012.85 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L7.09 7.91a16 16 0 006 6l.91-.91a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg> تواصل مع الدعم
      </button>
    </div>

    <div class="sp"></div>
  </div>
</main>

<script src="app.js"></script>
<script>
  // Set timeline progress
  const tl = document.getElementById('h-timeline');
  tl.style.setProperty('--prog', '50%');

  // Override ::after width dynamically
  (function(){
    const s = document.createElement('style');
    s.textContent = `#h-timeline::after{width:50%}`;
    document.head.appendChild(s);
  })();

  // Countdown timer
  let secs = 28 * 60 + 45;
  function tick() {
    if (secs <= 0) {
      document.getElementById('countdown').textContent = '00:00';
      document.getElementById('status-text').textContent = '✅ تم التوصيل!';
      document.getElementById('eta-display').textContent = '0';
      document.getElementById('step-delivery').classList.remove('active');
      document.getElementById('step-done').classList.add('done');
      // update timeline to full
      document.querySelector('style[data-trk]') && document.querySelector('style[data-trk]').remove();
      const s = document.createElement('style');
      s.setAttribute('data-trk','');
      s.textContent = `#h-timeline::after{width:100%}`;
      document.head.appendChild(s);
      return;
    }
    secs--;
    const m = Math.floor(secs / 60).toString().padStart(2,'0');
    const s2 = (secs % 60).toString().padStart(2,'0');
    document.getElementById('countdown').textContent = m + ':' + s2;
    document.getElementById('eta-display').textContent = Math.ceil(secs/60);
  }
  setInterval(tick, 1000);

  // Order items
  document.addEventListener('DOMContentLoaded', () => {
    const demo = [
      {emoji:'🍞', name:'عيش أبيض ملكي', qty:2, price:89},
      {emoji:'🥛', name:'حليب نيدو 400g', qty:1, price:2200},
      {emoji:'🍅', name:'طماطم طازجة', qty:2, price:350},
    ];
    const stored = JSON.parse(localStorage.getItem('jambak_mart_cart') || '[]');
    const items = stored.length ? stored : demo;

    document.getElementById('order-items-list').innerHTML = items.map(i => `
      <div style="display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:12px;padding:10px">
        <div style="font-size:28px">${i.emoji}</div>
        <div style="flex:1">
          <div style="font-size:13px;font-weight:700;color:var(--tx)">${i.name}</div>
          <div style="font-size:11px;color:var(--muted)">الكمية: ${i.qty}</div>
        </div>
        <div style="font-size:13px;font-weight:800;color:var(--p1)">${(i.price*i.qty).toLocaleString()} SDG</div>
      </div>`).join('');
  });
</script>
