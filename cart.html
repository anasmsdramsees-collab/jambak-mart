<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>السلة — جمبك مارت</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- ── APP SWITCHER ── -->
<div class="app-sw-wrap">
  <div class="app-sw">
    <button class="app-tab" onclick="location.href='jambak.html'">
      <img src="icon-jambak.png" alt="جمبك" class="app-tab-logo">
      <span>جمبك</span>
    </button>
    <button class="app-tab" onclick="location.href='hypermall.html'">
      <img src="icon-hypermall.png" alt="هايبر مول" class="app-tab-logo">
      <span>هايبر مول</span>
    </button>
    <button class="app-tab" onclick="location.href='taga.html'">
      <img src="icon-foodz.png" alt="فودز" class="app-tab-logo">
      <span>فودز</span>
    </button>
    <button class="app-tab" onclick="location.href='services.html'">
      <img src="icon-services.png" alt="الخدمات" class="app-tab-logo">
      <span>الخدمات</span>
    </button>
    <button class="app-tab" onclick="location.href='index.html'">
      <img src="icon-mart.png" alt="جمبك مارت" class="app-tab-logo">
      <span>جمبك مارت</span>
    </button>
  </div>
</div>


<header class="hdr">
  <a href="index.html" class="hdr-back">←</a>
  <div class="hdr-title">سلتي</div>
  <button id="clear-btn" onclick="clearCart()"
    style="background:none;border:none;font-size:13px;color:var(--red);font-family:inherit;font-weight:700;cursor:pointer;display:none;padding:0 4px">
    مسح الكل
  </button>
</header>

<main class="page" style="background:#F5F5F5;padding-top:0">

  <!-- Empty state -->
  <div id="cart-empty" style="display:none;text-align:center;padding:40px 20px 0">
    <div style="font-size:80px;margin-bottom:8px">🛒</div>
    <div style="font-size:18px;font-weight:800;color:#333;margin-bottom:6px">سلتك فارغة!</div>
    <div style="font-size:13px;color:#999;margin-bottom:24px">أضف منتجات لتبدأ تسوقك</div>

    <!-- Re-order banner -->
    <div style="background:linear-gradient(135deg,var(--p1),var(--p2));border-radius:16px;padding:16px;color:#fff;text-align:right;margin-bottom:16px;display:flex;align-items:center;gap:14px">
      <div style="font-size:36px">📦</div>
      <div style="flex:1">
        <div style="font-size:14px;font-weight:900;margin-bottom:2px">سلتك فارغة</div>
        <div style="font-size:11px;opacity:.85">أعد طلب مفضلاتك الآن!</div>
      </div>
      <a href="orders.html" style="background:#fff;color:var(--p1);font-size:11px;font-weight:900;padding:6px 12px;border-radius:999px;text-decoration:none;white-space:nowrap">إعادة الطلب</a>
    </div>

    <!-- Suggestions -->
    <div style="text-align:right;margin-bottom:10px">
      <span style="font-size:14px;font-weight:800;color:#333">⚡ يمكن يعجبك</span>
    </div>
    <div class="pscroll" id="suggest-scroll"></div>
  </div>

  <!-- Cart items -->
  <div id="cart-list"></div>

  <!-- Summary -->
  <div id="cart-summary-wrap" style="display:none">
    <div style="background:#fff;margin:0 0 10px;padding:16px">
      <!-- Promo -->
      <div class="fg" style="margin-bottom:14px">
        <label class="fl-lbl">🎁 كود خصم</label>
        <div class="promo-row">
          <input type="text" class="fi" id="promo-input" placeholder="أدخل كود الخصم">
          <button class="promo-btn" onclick="applyPromo()">تطبيق</button>
        </div>
        <div id="promo-msg" style="font-size:12px;margin-top:5px;display:none"></div>
      </div>

      <div class="sr"><span>المجموع الجزئي</span><span id="subtotal-val">0 SDG</span></div>
      <div class="sr"><span>رسوم التوصيل</span><span style="color:var(--grn);font-weight:700">500 SDG</span></div>
      <div class="sr"><span>الخصم</span><span id="discount-val" style="color:var(--acc)">−0 SDG</span></div>
      <div style="border-top:1px solid #EEE;margin:12px 0"></div>
      <div class="sr tot"><span>الإجمالي</span><span class="v" id="cart-total-val">0 SDG</span></div>
    </div>

    <!-- Checkout button -->
    <div style="padding:0 16px 16px">
      <a href="checkout.html" style="display:flex;align-items:center;justify-content:space-between;background:var(--p1);color:#fff;text-decoration:none;border-radius:14px;padding:16px 20px;font-size:15px;font-weight:800">
        <span>متابعة الدفع</span>
        <span id="cart-checkout-total">0 SDG</span>
      </a>
    </div>

    <!-- Trust badges -->
    <div style="background:#fff;padding:16px;display:flex;justify-content:space-around;margin-bottom:10px">
      <div style="text-align:center">
        <div style="font-size:22px">⚡</div>
        <div style="font-size:10px;color:#999;font-weight:700;margin-top:4px">توصيل سريع</div>
      </div>
      <div style="text-align:center">
        <div style="font-size:22px">🔒</div>
        <div style="font-size:10px;color:#999;font-weight:700;margin-top:4px">دفع آمن</div>
      </div>
      <div style="text-align:center">
        <div style="font-size:22px">↩️</div>
        <div style="font-size:10px;color:#999;font-weight:700;margin-top:4px">إرجاع مجاني</div>
      </div>
    </div>
  </div>

  <div class="sp"></div>
</main>

<nav class="bnav">
  <a href="index.html" class="bn"><span class="ico">🏠</span>الرئيسية</a>
  <a href="browse.html" class="bn"><span class="ico">🔍</span>تصفح</a>
  <a href="orders.html" class="bn"><span class="ico">📦</span>طلباتي</a>
  <a href="account.html" class="bn"><span class="ico">👤</span>حسابي</a>
</nav>

<script src="app.js"></script>
<script>
  const PROMOS = {'JAMBAK10':10,'KHARTOUM':15,'WELCOME':20};
  let appliedDiscount = 0;

  function refreshPage() {
    const hasItems = cart.length > 0;
    document.getElementById('cart-summary-wrap').style.display = hasItems ? 'block' : 'none';
    document.getElementById('cart-empty').style.display = hasItems ? 'none' : 'block';
    document.getElementById('clear-btn').style.display = hasItems ? 'inline' : 'none';

    const sub = getCartTotal();
    const disc = Math.round(sub * appliedDiscount / 100);
    const total = sub + 500 - disc;
    document.getElementById('subtotal-val').textContent = sub.toLocaleString() + ' SDG';
    document.getElementById('discount-val').textContent = '−' + disc.toLocaleString() + ' SDG';
    document.getElementById('cart-total-val').textContent = total.toLocaleString() + ' SDG';
    const ctEl = document.getElementById('cart-checkout-total');
    if (ctEl) ctEl.textContent = total.toLocaleString() + ' SDG';

    renderCartList(document.getElementById('cart-list'));

    const count = getCartCount();
    document.querySelectorAll('.cbadge').forEach(el => {
      el.textContent = count;
      el.classList.toggle('on', count > 0);
    });
  }

  function clearCart() {
    cart.length = 0;
    localStorage.setItem('jambak_mart_cart', '[]');
    refreshPage();
    showToast('🗑️ تم مسح السلة');
  }

  function applyPromo() {
    const code = document.getElementById('promo-input').value.toUpperCase().trim();
    const msg = document.getElementById('promo-msg');
    const pct = PROMOS[code];
    if (pct) {
      appliedDiscount = pct;
      msg.style.display = 'block'; msg.style.color = 'var(--grn)';
      msg.textContent = '✅ تم تطبيق خصم ' + pct + '%';
      refreshPage();
    } else {
      msg.style.display = 'block'; msg.style.color = 'var(--red)';
      msg.textContent = '❌ الكود غير صحيح';
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    refreshPage();
    renderScroll('suggest-scroll', PRODUCTS.filter(p => p.discount > 0).slice(0, 6));
  });

  const _origUpd = updateQty;
  window.updateQty = function(id, delta) { _origUpd(id, delta); refreshPage(); };
  window.removeFromCart = function(id) {
    cart.splice(0, cart.length, ...cart.filter(i => i.id !== id));
    localStorage.setItem('jambak_mart_cart', JSON.stringify(cart));
    refreshPage();
  };
</script>
</body>
</html>
